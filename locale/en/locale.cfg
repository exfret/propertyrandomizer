help-amount=Percentage of eligible targets selected for this handler. Selection is stable across retries. Constraints and fallback may leave selected targets unchanged. 0 selects none; 100 selects all.
help-keep_category=Chance of trying the original crafting category first. This is a preference: another category may be necessary. 100 does not guarantee the original machine.
help-ingredient_count=Range used to choose the number of distinct recipe ingredients. Preserve keeps the original count where the final crafting machinery allows it. Candidate shortages can cause fallback.
help-fluids=Influences fluid slots gained or lost by recipe shape planning. Preserve adds no shape-driven fluid changes; item/fluid identity swaps remain a separate randomization. Plans still respect available machinery and can fall back.
help-resource_balance=On scores changes against the original raw-resource distribution. Off removes that score, while total estimated cost is still considered. Neither option imposes an exact resource requirement.
