help-range=Overall relative range. Lower and upper ranges can override its two sides. Match variance uses the effective variance level.
help-range_min=Relative range below the original value. Match range follows the overall range; Inherit keeps the fallback for this side.
help-range_max=Relative range above the original value. Match range follows the overall range; Inherit keeps the fallback for this side.
help-variance=Variability of the numerical random walk. Match range uses the effective overall range. Larger levels allow larger changes.
help-bias=Replace the global bias preset for this target. The randomization's own adjustment and better/worse direction still apply.
help-chaos=Replace the global chaos preset for this target, including its effect on relative ranges.
toggle-only=This randomization supports an on/off override. Its choices do not use numerical range or variance tuning.
