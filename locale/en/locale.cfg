[mod-setting-description]
propertyrandomizer-dump-data-raw=At the end of loading, writes all of data.raw to the game's log between __DATA_RAW_BEGIN__ and __DATA_RAW_END__ lines, so the randomized game can be extracted into a mod that loads it without randomizing again. Makes loading slower and the log much larger.
propertyrandomizer-preset=Choose from a curated list of settings presets. Use __CONTROL__randomizer-panel__ in-game to access the the customizer for more fine-grained control.
propertyrandomizer-seed=Changing this will change how everything is randomized.
propertyrandomizer-bias=How much the randomization process should try to make things in your favor.
propertyrandomizer-chaos=How random to make things. Play higher values at your own risk.
propertyrandomizer-dupes=Adds copies of many core buildings (inserters, pipes, power, mining, crafting, turrets, robots and vehicles), of every module, of nutrients and the fuel cells, of a few weapons and of some armor and equipment, each in its own colors, so the randomizer can make the copies differ. Also more planets of each kind (Space Age), each with its own science packs and a copied technology tree that needs them, and a new random graph of space connections among all the planets, so planetary changes have more planets to work with. Number of duplicates sets how many copies of each there are. Work in progress: more duplicated things will follow.
propertyrandomizer-dupe-count=How many copies Duplicates adds of each duplicated building, item and planet, from 1 to 8. Each copy of a planet comes with its own copies of the buildings that belong to that planet. More copies give the randomizer more to work with, but loading takes longer and fails more often. Does nothing without Duplicates.
propertyrandomizer-extra-starting-items=Start with a few more buildings for a faster start.
propertyrandomizer-logistic=How many different logistical properties to randomize. For example, speeds of belts/inserters, lengths of underground belts, supply area of electric poles, etc.
propertyrandomizer-production=How many different production properties to randomize. For example, capabilities of machines, like machine crafting speeds and module slots.
propertyrandomizer-military=How many different military properties to randomize. For example, gun shooting speeds, bonus damage, etc. Turn this down or off if you are having troubles with biter difficulty.
propertyrandomizer-misc=How many different miscellaneous things to randomize (ones that do not fit into the above categories). I had some creative ideas for many of these.
propertyrandomizer-technology=Randomizes the technology tree (which techs are prerequisites to which other ones).
propertyrandomizer-recipe=Randomizes recipe ingredients.
propertyrandomizer-recipe-science-pack=If recipe ingredient randomization is on, restricts it to only affect science pack recipes.
propertyrandomizer-recipe-tech-unlock=Randomizes which technology a recipe is unlocked by.
propertyrandomizer-recipe-tech-unlock-duplicates=Adds an extra copy of each recipe unlock in the tech tree to smooth out progression issues.
propertyrandomizer-item=Switches around where items are in the game. For example, instead of mining coal you might mine fish, or furnaces could replace circuits as one of the most common intermediates.
propertyrandomizer-item-percent=What percentage of non-resource items should be randomized.
propertyrandomizer-item-retries=Item randomization is finnicky, so multiple attempts are made in case one fails. This can drastically prolong loading time if there are multiple failures.
propertyrandomizer-dev-unified=Runs the unified randomizations that are still in development. Off in releases.
propertyrandomizer-operation-readiness=Experimental operation-readiness repair and audit. Disabled by default: this approach did not meet reliability or loading-time goals and is paused.
propertyrandomizer-unified-preview=Preview the new unified randomization process, which will be the default in the future. Randomizes items, recipes, planetary fluids, entities, biters, and more all at once. Also rebuilds the tech tree to reflect the new progression structure. Not compatible with old recipe/item/technology tree randomizations below.
propertyrandomizer-unified-retries=Unified randomization fails occasionally too, so multiple attempts are made to prevent startup errors. This also can prolong loading time if many failures occur.
propertyrandomizer-unified-tech-prereqs=Does the same thing as non-unified technology prereq randomization, but with a new unified algorithm. The unified algorithm runs randomizations simultaneously and will be the default in future versions.
propertyrandomizer-unified-recipe-tech-unlocks=Does the same thing as non-unified recipe unlock randomization, but with a new unified algorithm. The unified algorithm runs randomizations simultaneously and will be the default in future versions.
propertyrandomizer-unified-spoiling=Randomizes which items spoil and what they spoil into, with about twice as many spoiling items as usual. Still in development: only takes effect with the unified preview. Uses a new unified algorithm that runs randomizations simultaneously and will be the default in future versions.
propertyrandomizer-unified-tech-science-packs=Randomizes the science packs that technologies require. Uses a new unified algorithm that runs randomizations simultaneously and will be the default in future versions.
propertyrandomizer-unified-entity-operation-fluid=Randomizes the fluids needed to operate a machine (flamethrower fuel, fusion reactor fluid, etc.). Uses a new unified algorithm that runs randomizations simultaneously and will be the default in future versions.
propertyrandomizer-unified-mining-fluid-required=Randomizes the fluid needed to mine a resource, and whether a fluid is needed at all. Uses a new unified algorithm that runs randomizations simultaneously and will be the default in future versions.
propertyrandomizer-unified-entity=Randomizes how you get each building and other entity: which item places it (sometimes an item that placed nothing before), and what's found in the wild (some buildings can be salvaged there). At least one kind of each thing needed by the hundreds, like belts, inserters and poles, can always be made automatically. Uses a new unified algorithm that runs randomizations simultaneously and will be the default in future versions.
propertyrandomizer-unified-entity-biters=With entity randomization, what unit spawners spawn can change too: biters can carry buildings to loot, and buildings can be friendly biters.
propertyrandomizer-military-rebalance=When entity randomization moves enemies between planets' spawners (with biters on), rebalances them. A spawner keeps no more of another planet's enemies than their home spawners would. Enemies from other planets are weaker on the starting planet, and the starting planet's enemies are stronger elsewhere: their health and their damage each match the enemies there at the evolution they spawn most, and the pollution it takes them to join an attack matches what attacks usually cost there.
propertyrandomizer-unified-technology-delinearization=Technology randomization creates very linear tech trees. This option modifies the randomization process in the case of technologies specifically so that the tree becomes less linear. Only applies to unified technology randomization.
propertyrandomizer-tech-tree-rebuild=Gives each recipe its own technology and rebuilds the tech tree so that you can always craft something when you unlock it.
propertyrandomizer-planetary-oceans=(Space Age) Swaps oceans between planets: each planet's lakes and seas look like, and pump the fluid of, another planet's ocean. The starting planet keeps its own fluid. Planets get only the alternate recipes they need to keep making their own science pack, building rockets and making electricity from local resources.
propertyrandomizer-planetary-biomes=Mixes terrain appearances and decorative vegetation from different planets into regions. Original Nauvis keeps its biomes. Keeps the local land and water layout and terrain properties. Harvestable plants, trees and cliffs are unchanged by this setting.
propertyrandomizer-planetary-resources=(Space Age) Swaps resources between planets, the starting planet included: ores trade places with ores and fluid wells with fluid wells, each generating where the old one did. The starting planet gets back what its early game and its own science need as extra patches near the crash site. The planet's own recipes use the new resource in place of the one it lost; if it still needs a lost resource, it gets a few extra patches of it back. Each planet, including each duplicate, has one shared patch size, frequency and richness profile, compensated and checked per resource to keep estimated totals close to baseline. Its tooltip shows the final balanced multipliers.
propertyrandomizer-planetary-lightning=(Space Age) Moves lightning from its planet to another planet other than the starting planet, together with the lightning rod and collector: the new planet can craft them and gets the rod when it's discovered. Buildings on a planet with lightning need a lightning rod nearby. If the old planet still needs its lightning (like for power from its own resources), it keeps it as well. Skipped when the old (non-unified) technology, recipe or item randomizations are on.
propertyrandomizer-planetary-freezing=(Space Age) Moves freezing (buildings needing heat) from its planet to another planet other than the starting planet, together with the heating tower research, which then comes with that planet's discovery. If the old planet still needs to be frozen, it stays frozen as well. Skipped when the old (non-unified) technology, recipe or item randomizations are on.
propertyrandomizer-planetary-locks=(Space Age) Moves which planets accept recipes and buildings that only work on some planets, like the foundry or biochamber: their planets other than the starting planet are swapped for others. Science packs stay on their planets. New surface properties with silly names say where each one works now, and its description lists the planets. If a planet still needs something that moved away, it accepts it again too. Skipped when the old (non-unified) technology, recipe or item randomizations are on.
propertyrandomizer-planetary-rewards-only=Development aid: only the planet rewards named here move (technology names, comma-separated); empty for all.
propertyrandomizer-planetary-rewards-rehome=Work in progress: each planet's science moves into the special machine that arrived there, instead of the move being undone.
propertyrandomizer-planetary-rewards=(Space Age, work in progress) Moves what a planet gives you to build elsewhere, like the big mining drill or the biochamber, to another planet: the recipe works only there, and its technology is researched by doing something on that planet, with that planet's science pack. What the old planet still needs for its own science stays there as well. The log lists every planet's rewards (PLANETFEATURES lines). Skipped when the old (non-unified) technology, recipe or item randomizations are on.
propertyrandomizer-planetary-connections=(Space Age) Draws a new random graph of space connections with the shape of the old one: every planet keeps about as many connections as before, connections favor nearby orbits, and every planet can still be reached from the starting planet. A new route is as long and as dangerous as the old route between the most similar orbits. Always on with Duplicates, which add more planets of each kind. Skipped when the old (non-unified) technology, recipe or item randomizations are on.
propertyrandomizer-planetary-enemies=(Space Age, work in progress) Moves enemies between planets: demolisher territories go to random planets other than the starting planet, and the starting planet's enemies (biters, spitters and worms, which come with their map gen slider) leave its copies for random planets. A planet getting them gets pollution if it has none, so they attack, and Gleba gets none, since its spores are its own spawners' pollutant. The starting planet keeps its own enemies.
propertyrandomizer-planetary-superposed=(Space Age) Runs the planetary changes above in superposed mode, for testing: instead of each change repairing its planet before the rest of randomization, the game before the changes stays in the logic as a debt. Unified randomization pays what it can (moved recipes take ingredients their new planets have), and whatever is still owed afterwards is settled with the cheapest fix that works: extra patches of a lost resource, a moved lock accepting its old planet again, or a move undone. Recipes that used a swapped ocean's fluid or a swapped resource are still edited up front. Does nothing without the unified randomizations in development (the preview) or without any of the planetary changes above.
propertyrandomizer-planetary-fix-pass=(Space Age, work in progress, needs the unified randomizations in development) Each planetary change above but ocean swaps is first repaired by a fix pass that changes recipe ingredients, recipe categories, energy sources, science packs, research triggers and prerequisites, preferring whatever replaced the old thing on that planet, and makes a planet copy of a shared recipe, named like Recipe (Planet), when nothing fits everywhere. If that isn't enough, the change is repaired the usual way instead. Also lets technologies trade research triggers, and lets planets build rockets with machines delivered once. Off with superposed mode.
propertyrandomizer-icon=Every icon in the game is randomized. Are you crazy?
propertyrandomizer-sound=Every sound in the game is randomized. Who are you?
propertyrandomizer-gui=Positions of recipes in the GUI are randomized. What the heck?
propertyrandomizer-locale=Shuffles the names of everything in the game. Why?
propertyrandomizer-colors=Each color value is randomized. How?..
propertyrandomizer-numerical-algorithm=Choose between two algorithms used for randomizing the numerical properties. One produces a bell curve without cutoffs, while the other performs a more safeguarded random walk. Does not impact non-numerical randomizations (like recipe ingredients).
propertyrandomizer-overrides=For extra fancy customization. See README for more information. README can be found in the mod folder locally or online here: github.com/exfret/propertyrandomizer

